<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spinning Logo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .logo-container {
      width: 100%;
      height: 100%;
      min-height: 250px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .spinning-logo {
      width: min(300px, 80vw);
      height: auto;
      display: block;

      animation: spin 12s linear infinite;
      transform-origin: center;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Stops the animation when someone hovers over the logo */
    .spinning-logo:hover {
      animation-play-state: paused;
    }

    /* Accessibility setting */
    @media (prefers-reduced-motion: reduce) {
      .spinning-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="logo-container">
    <img
      class="spinning-logo"
      src="images/flywheel.png"
      alt="Flywheel"
    >
  </div>

</body>
</html>
